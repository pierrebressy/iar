<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Cible AR — impression A4</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
  <style>
    @page { size: A4 portrait; margin: 0; }
    html, body { margin: 0; background: #e9e9ec; font-family: -apple-system, system-ui, sans-serif; }
    .controls { padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .controls input { width: 80px; font: inherit; padding: 4px 6px; }
    .sheet { width: 210mm; height: 297mm; margin: 0 auto 24px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    svg { display: block; width: 210mm; height: 297mm; }
    @media print { .controls { display: none; } body { background: #fff; } .sheet { margin: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <div class="controls">
    <label>Ancre <input id="id" value="A1"></label>
    <button onclick="draw()">Générer</button>
    <button onclick="print()">Imprimer (échelle 100 %)</button>
  </div>
  <div class="sheet"><svg id="svg" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <script>
    // Dimensions en mm — doivent correspondre à config.json (qrSide, frameOuter, frameInner)
    const QR = 120, FO = 190, FI = 170, CX = 105, CY = 112;
    function draw() {
      const id = document.getElementById('id').value.trim() || 'A1';
      const q = qrcode(0, 'M'); q.addData('AR-ANCHOR:' + id); q.make();
      const n = q.getModuleCount(), m = QR / n, x0 = CX - QR / 2, y0 = CY - QR / 2;
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
        if (q.isDark(r, c)) d += `M${(x0 + c * m).toFixed(4)} ${(y0 + r * m).toFixed(4)}h${m.toFixed(4)}v${m.toFixed(4)}h-${m.toFixed(4)}z`;
      const fo = FO / 2, fi = FI / 2;
      const frame = `M${CX - fo} ${CY - fo}h${FO}v${FO}h-${FO}z M${CX - fi} ${CY - fi}v${FI}h${FI}v-${FI}z`;
      const ty = CY + fo + 14;
      document.getElementById('svg').innerHTML = `
        <path d="${frame}" fill="#000" fill-rule="evenodd" shape-rendering="crispEdges"/>
        <path d="${d}" fill="#000" shape-rendering="crispEdges"/>
        <g font-family="Helvetica, Arial, sans-serif" fill="#222">
          <text x="${CX}" y="${ty}" font-size="6" text-anchor="middle" font-weight="bold">Ancre ${id}</text>
          <text x="${CX}" y="${ty + 9}" font-size="3.6" text-anchor="middle">Imprimer à 100 %. Contrôle : côté extérieur du cadre = ${FO.toFixed(1)} mm, intérieur = ${FI.toFixed(1)} mm, QR = ${QR.toFixed(1)} mm.</text>
          <text x="${CX}" y="${ty + 15}" font-size="3.6" text-anchor="middle">Si l'impression diffère, reportez les cotes mesurées dans config.json (en mètres).</text>
          <text x="${CX}" y="${ty + 21}" font-size="3.6" text-anchor="middle">Repère : origine au centre du cadre, x vers la droite, y vers le haut, z sort de la feuille.</text>
        </g>
        <g stroke="#c0392b" stroke-width="0.6" fill="#c0392b" font-family="Helvetica, Arial, sans-serif" font-size="4">
          <line x1="20" y1="${ty + 58}" x2="40" y2="${ty + 58}"/><path d="M40 ${ty + 56.5} l3 1.5 l-3 1.5z"/>
          <text x="45" y="${ty + 59.5}" stroke="none">x</text>
          <line x1="20" y1="${ty + 58}" x2="20" y2="${ty + 38}"/><path d="M18.5 ${ty + 38} l1.5 -3 l1.5 3z"/>
          <text x="18.5" y="${ty + 32}" stroke="none">y</text>
          <circle cx="20" cy="${ty + 58}" r="1.6" fill="none"/><circle cx="20" cy="${ty + 58}" r="0.5"/>
          <text x="24" y="${ty + 64}" stroke="none">z (vers vous)</text>
        </g>`;
    }
    draw();
  </script>
</body>
</html>
